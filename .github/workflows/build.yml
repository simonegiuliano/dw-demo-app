name: Java CI with Maven

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4 # Aggiornato a v4
    
    - name: Configurazione JDK 1.8
      uses: actions/setup-java@v4 # Aggiornato a v4
      with:
        distribution: 'temurin'
        java-version: '8'
        cache: 'maven'
        
    - name: Build con Maven
      run: mvn -B install --file pom.xml # Esegue la build come richiesto
      
    - name: Salvataggio Artifact (JAR)
      uses: actions/upload-artifact@v4 # Aggiornato a v4 (risolve il tuo errore)
      with:
        name: demo-app-jar
        path: target/*.jar # Prende il file generato nella cartella target